name: tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version packagename=node
          node-version: '24.22.3'
      - name: Install dependencies
        run: npm ci && npm run postinstall
      - name: Run tests
        run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.27.4'
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version packagename=node
          node-version: '24.22.3'
      - name: Install dependencies
        run: npm ci && npm run postinstall
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.27.4'
      - name: Run Go tests
        working-directory: ./backend
        run: go test -mod=vendor -race ./...
      - name: Check Go module vendoring
        working-directory: ./backend
        run: |
          go mod tidy
          go mod vendor
          go mod verify
          test -z "$(git status --porcelain)" || (echo "please run 'go mod tidy && go mod vendor', and submit your changes"; exit 1)
      - name: Run Go static checks
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: ./backend
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0
          args: --config=.golangci.yml
          skip-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version packagename=node
          node-version: '24.22.3'
      - name: Install NPM dependencies
        run: npm ci && npm run postinstall
      - name: npm run prettier
        run: |
          npm run prettier
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "please run `npm run prettier` and submit changes"; exit 1)
      - name: npm run lint
        run: npm run lint
      - name: Check proto files
        working-directory: ./backend
        run: |
          ./ctl.sh update-proto
          test -z "$(git status --porcelain)" || (echo "please run './ctl.sh update-proto', and submit your changes"; exit 1)
