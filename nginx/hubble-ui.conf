# http-level defaults for the server block that Cilium's chart mounts as
# conf.d/default.conf; that block inherits them, so the chart needs no change.

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# index.html names the content-hashed bundles of the running version: a cached
# copy after an upgrade names bundles that are gone, and the page stays blank.
map $uri $hubble_ui_cache_control {
    ~^/(.*/)?bundle\.  "public, max-age=31536000, immutable";
    default            "no-cache";
}
add_header Cache-Control $hubble_ui_cache_control;
